# Publishes a GitHub release whenever main has a version (Info.plist CFBundleShortVersionString)
# that has no v<version> tag yet. To release: bump the version and merge to main.
name: Release

on:
  push:
    branches: [main]
    paths: [Info.plist]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # Optional: sign with the same certificate as local builds, so macOS keeps Accessibility and
      # Microphone grants across updates. Without these secrets the app is signed ad hoc and users
      # re-grant both permissions after each update.
      - name: Import signing certificate
        if: steps.version.outputs.exists != 'true' && env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "IDENTITY=Apple Development" >> "$GITHUB_ENV"

      - name: Build and publish
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export IDENTITY="${IDENTITY:--}"   # "-" = ad hoc
          echo "Signing with: $IDENTITY"
          ./release.sh
